<div class="main-container">
  <ion-button expand="block" id="open-create-set">Create Set</ion-button>
</div>

<ion-modal #modal trigger="open-create-set" (willPresent)="onWillPresent()">
  <ng-template>
    <ion-header>
      <ion-toolbar>
        <ion-title>Create Set</ion-title>
        <ion-buttons slot="end">
          <ion-button (click)="modal.dismiss()"> Close </ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>
    <ion-content>
      <ion-nav #nav></ion-nav>
    </ion-content>
  </ng-template>
</ion-modal>
<ion-content
  ><div class="main-container">
    @for (set of sets; track set.id) {
      <span>
        {{ set }}
      </span>
    }
  </div></ion-content
>
