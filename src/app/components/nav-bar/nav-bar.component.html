<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="home" [routerLink]="['/home']">
      <ion-icon
        [name]="isActive('home') ? 'albums' : 'albums-outline'"
      ></ion-icon>
      Home
    </ion-tab-button>
    <ion-tab-button tab="settings" [routerLink]="['/settings']">
      <ion-icon
        [name]="isActive('settings') ? 'settings' : 'settings-outline'"
      ></ion-icon>
      Settings
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
